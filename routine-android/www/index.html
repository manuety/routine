<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Routine">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>Routine</title>
<style>
:root{--bg:#fff;--fg:#1c1c1e;--mute:#8e8e93;--line:#e5e5ea;--fill:#f2f2f2;--acc:#0a84ff;--bad:#ff3b30;--r:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter',system-ui,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input{font-family:inherit}
#app{max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding:max(18px,env(safe-area-inset-top)) 20px max(18px,env(safe-area-inset-bottom))}
.page{flex:1;display:flex;flex-direction:column;min-height:0}
.body{flex:1;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:flex-start;padding:6px 0 18px;gap:12px}
.hello{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.date{color:var(--mute);font-size:15px;margin-top:3px}
.title{font-size:32px;font-weight:700;letter-spacing:-.02em;margin:8px 0 6px;line-height:1.15}
.lead{color:var(--mute);font-size:17px;margin:0 0 16px;line-height:1.35}
.hero{flex:1;display:flex;flex-direction:column;justify-content:center}
.btn{appearance:none;border:0;border-radius:16px;height:56px;font-size:17px;font-weight:600;width:100%;cursor:pointer;transition:transform .08s,opacity .15s}
.btn:active{transform:scale(.98);opacity:.85}
.btn:disabled{opacity:.35;cursor:default}
.btn.p{background:var(--acc);color:#fff}
.btn.s{background:var(--fill);color:var(--fg)}
.btn.t{background:none;color:var(--acc);height:40px;width:auto;padding:0 8px;font-size:16px;font-weight:500}
.btn.bad{background:none;color:var(--bad);height:44px}
.bottom{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding-top:18px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--fill);border-radius:var(--r);padding:22px}
.eyebrow{color:var(--mute);font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.big{font-size:60px;font-weight:300;font-variant-numeric:tabular-nums;letter-spacing:-.03em;margin:8px 0 4px;line-height:1.05}
.h2{font-size:30px;font-weight:700;letter-spacing:-.02em;margin:6px 0 0;line-height:1.15}
.sub{color:var(--mute);font-size:15px}
.rem{display:flex;gap:6px;align-items:flex-start;font-size:13px;color:var(--mute);margin-top:7px;line-height:1.3}
.rem svg{flex:none;margin-top:1px}
.card .rem{font-size:14px}
.sec{margin:22px 0 8px}
.urow{display:flex;justify-content:space-between;gap:12px;padding:13px 2px;border-bottom:1px solid var(--line)}
.urow:last-child{border-bottom:0}
.un{font-size:17px;color:#48484a}
.ud{color:var(--mute);font-size:15px;white-space:nowrap}
.inp{width:100%;height:54px;border-radius:14px;border:1px solid var(--line);background:#fff;padding:0 16px;font-size:17px;outline:none;color:var(--fg)}
.inp:focus{border-color:var(--acc)}
.lbl{font-size:13px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.05em;margin:16px 0 8px}
.err{color:var(--bad);font-size:15px;margin:4px 0 0;min-height:20px}
.dots{display:flex;gap:6px;margin-bottom:6px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--acc)}
.tabs{display:flex;gap:3px;background:var(--fill);padding:3px;border-radius:12px}
.tab{flex:1;border:0;background:none;height:38px;border-radius:9px;font-size:14px;font-weight:600;color:#48484a;cursor:pointer}
.tab.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.14);color:var(--acc)}
.tab.today{text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:2px}
.edtitle{font-size:22px;font-weight:700;margin:18px 0 10px}
.trow{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:14px;padding:10px 8px 10px 10px;margin-bottom:8px}
.mv{display:flex;flex-direction:column;gap:2px}
.ic{width:30px;height:24px;border:0;border-radius:8px;background:var(--fill);color:var(--fg);font-size:14px;cursor:pointer;line-height:1}
.ic:disabled{opacity:.3}
.tinfo{flex:1;min-width:0;cursor:pointer}
.tn{font-size:17px;font-weight:600;word-break:break-word}
.tm{font-size:14px;color:var(--mute)}
.empty{color:var(--mute);text-align:center;padding:36px 0;font-size:16px}
.opts{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.opt{appearance:none;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:14px 16px;font-size:17px;color:var(--fg);cursor:pointer}
.opt.on{border-color:var(--acc);background:#f4f9ff;font-weight:600}
.added{margin-top:14px}
.added .urow .un{font-size:15px}
.greet{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;animation:fade .5s ease}
.greet h1{font-size:40px;letter-spacing:-.03em;margin:0;line-height:1.15}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.picker{position:relative;height:260px;margin:6px 0;user-select:none;-webkit-user-select:none}
.band{position:absolute;left:0;right:0;top:104px;height:52px;background:var(--fill);border-radius:12px}
.cols{position:relative;display:flex;justify-content:center;height:100%}
.col{flex:1;max-width:170px;height:260px;overflow-y:auto;padding:104px 0;scroll-snap-type:y mandatory;scrollbar-width:none;outline:none;overscroll-behavior:contain;touch-action:pan-y;cursor:grab;-webkit-mask-image:linear-gradient(transparent,#000 26%,#000 74%,transparent);mask-image:linear-gradient(transparent,#000 26%,#000 74%,transparent)}
.col::-webkit-scrollbar{display:none}
.it{height:52px;display:flex;align-items:center;justify-content:center;scroll-snap-align:center;will-change:transform,opacity}
.row{display:flex;align-items:baseline}
.n{width:54px;text-align:right;font-size:36px;color:var(--mute);font-variant-numeric:tabular-nums;line-height:1}
.u{width:50px;text-align:left;padding-left:7px;font-size:18px;font-weight:700;color:#000;opacity:0;line-height:1}
.it.sel .n{color:var(--fg)}
.it.sel .u{opacity:1}
.sheetwrap{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.sback{position:absolute;inset:0;background:rgba(0,0,0,.35);animation:fadeb .2s ease}
@keyframes fadeb{from{opacity:0}to{opacity:1}}
.sheet{position:relative;width:100%;max-width:480px;background:#fff;border-radius:24px 24px 0 0;padding:20px 20px max(20px,env(safe-area-inset-bottom));max-height:92dvh;overflow-y:auto;animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet h3{margin:0 0 4px;font-size:22px}
.stack{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.chk{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--line);font-size:17px;cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;color:var(--fg)}
.chk b{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:inline-block;flex:none}
.chk.on b{background:var(--acc);border-color:var(--acc);box-shadow:inset 0 0 0 4px #fff}
html.native #app{padding-top:max(44px,env(safe-area-inset-top))}
#toast{position:fixed;top:max(12px,env(safe-area-inset-top));left:50%;transform:translate(-50%,-160%);background:#1c1c1e;color:#fff;border-radius:16px;padding:12px 18px;z-index:100;transition:transform .35s ease;display:flex;flex-direction:column;max-width:calc(100% - 32px);min-width:200px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
#toast.show{transform:translate(-50%,0)}
#toast b{font-size:15px}
#toast span{font-size:14px;opacity:.8}
</style>

<body>
<div id="app"></div>
<div id="toast"></div>
<script>
(function(){
'use strict';
const KEY='routine_app_v1';
const ITEM=52;
const DAYS=[['mon','Lunedì','Lun'],['tue','Martedì','Mar'],['wed','Mercoledì','Mer'],['thu','Giovedì','Gio'],['fri','Venerdì','Ven'],['sat','Sabato','Sab'],['sun','Domenica','Dom']];
const JSKEY=['sun','mon','tue','wed','thu','fri','sat'];
const BELL='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>';

const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const pad=n=>String(n).padStart(2,'0');
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const el=html=>{const t=document.createElement('template');t.innerHTML=html.trim();return t.content.firstElementChild};
const dateStr=(d=new Date())=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseDate=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const dayKeyOf=d=>JSKEY[d.getDay()];
const dayName=k=>DAYS.find(d=>d[0]===k)[1];
const clock=m=>pad(Math.floor(m/60))+':'+pad(m%60);
function fmtCd(ms){const s=Math.max(0,Math.floor(ms/1000));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=s%60;return h>0?h+':'+pad(m)+':'+pad(ss):pad(m)+':'+pad(ss)}
function fmtDur(min){if(!min)return 'senza timer';const h=Math.floor(min/60),m=min%60;return (h?h+' h':'')+(h&&m?' ':'')+(m?m+' min':'')}

/* ---------- state ---------- */
function blank(){return{name:'',onboarded:false,routines:null,dayReminders:[],today:null}}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&typeof s==='object')return Object.assign(blank(),s)}catch(e){}return blank()}
let S=load();
const ui={screen:'main',wiz:null,co:null,sheet:null,greeting:null,edDay:'mon',lastKey:null,obName:''};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}try{syncNative()}catch(e){}}
function newToday(){return{date:dateStr(),phase:'checkin',schoolGo:null,schoolStart:0,schoolEnd:0,prepMin:0,prepEndAt:0,taskStartedAt:0,done:[],extra:{},notified:{}}}
function rollDay(){
  if(!S.today||S.today.date!==dateStr()){
    S.today=newToday();
    const ds=dateStr();
    S.dayReminders=(S.dayReminders||[]).filter(r=>r.date>=ds);
    ui.wiz=null;ui.co=null;ui.lastKey=null;ui.sheet=null;ui.greeting=null;
    save();return true;
  }
  return false;
}
function defaultTasks(){return[
  {id:uid(),name:'Tempo libero',durationMinutes:120,reminder:''},
  {id:uid(),name:'Allenamento',durationMinutes:30,reminder:''},
  {id:uid(),name:'Compiti',durationMinutes:60,reminder:''},
  {id:uid(),name:'Cena',durationMinutes:45,reminder:''}
]}
function defaultRoutines(){const r={};DAYS.forEach(d=>r[d[0]]=defaultTasks());return r}
const cloneTasks=l=>l.map(t=>({...t,id:uid()}));

const tsAt=m=>{const d=parseDate(S.today.date);return new Date(d.getFullYear(),d.getMonth(),d.getDate(),0,m).getTime()};
const todayKey=()=>dayKeyOf(parseDate(S.today.date));
const todayRoutine=()=>S.routines[todayKey()]||[];
const curTask=()=>todayRoutine().find(x=>!S.today.done.includes(x.id));
const taskEnd=t=>S.today.taskStartedAt+t.durationMinutes*60000+(S.today.extra[t.id]||0);
function subOf(){
  const t=S.today,now=Date.now();
  if(!t.schoolGo)return 'routine';
  if(now<tsAt(t.schoolStart))return 'wait';
  if(now<tsAt(t.schoolEnd))return 'school';
  return 'routine';
}
function nextDateObj(){const d=parseDate(S.today.date);return new Date(d.getFullYear(),d.getMonth(),d.getDate()+1)}
function remindersFor(date,target){return S.dayReminders.filter(r=>r.date===date&&r.target===target).map(r=>r.text)}
function consume(target){S.dayReminders=S.dayReminders.filter(r=>!(r.date===S.today.date&&r.target===target))}
function taskRems(t){return [t.reminder,...remindersFor(S.today.date,t.id)].filter(Boolean)}
const remHtml=l=>l.map(x=>`<div class="rem">${BELL}<span>${esc(x)}</span></div>`).join('');

/* ---------- notifications ---------- */
function showToast(title,body){
  const tt=$('#toast');
  tt.innerHTML='<b>'+esc(title)+'</b>'+(body?'<span>'+esc(body)+'</span>':'');
  tt.classList.add('show');
  clearTimeout(showToast.h);
  showToast.h=setTimeout(()=>tt.classList.remove('show'),5500);
}
function sysNotify(title,body){
  if(NP())return;
  try{
    if(!('Notification' in window)||Notification.permission!=='granted')return;
    if(navigator.serviceWorker&&navigator.serviceWorker.controller){
      navigator.serviceWorker.ready.then(r=>r.showNotification(title,{body,icon:'icon.svg',tag:'routine'}));
    }else{new Notification(title,{body,icon:'icon.svg'})}
  }catch(e){}
}
function notify(key,title,body,ts){
  const t=S.today;
  if(t.notified[key])return;
  t.notified[key]=1;save();
  if(ts&&Date.now()-ts>90000)return;
  showToast(title,body);sysNotify(title,body);
}
function askPerm(){
  if(NP()){initNative();return}
  try{if('Notification' in window&&Notification.permission==='default')Notification.requestPermission()}catch(e){}
}

/* ---------- native background notifications (Capacitor) ---------- */
function NP(){
  const C=window.Capacitor;
  return C&&C.isNativePlatform&&C.isNativePlatform()&&C.Plugins&&C.Plugins.LocalNotifications||null;
}
function planNotifs(){
  const out=[],t=S.today;
  if(!t||!S.routines||!S.onboarded)return out;
  const now=Date.now();
  const add=(at,title,body)=>{if(at>now+1500)out.push({at,title,body})};
  if(t.phase==='prep')add(t.prepEndAt,'Zaino','È ora di preparare lo zaino');
  if(t.schoolGo&&(t.phase==='prep'||t.phase==='backpack'||t.phase==='day')){
    add(tsAt(t.schoolStart),'Scuola','Timer scuola partito');
    add(tsAt(t.schoolEnd),'Scuola finita','Parte la routine');
  }
  if(t.phase==='day'){
    const rest=todayRoutine().filter(x=>!t.done.includes(x.id));
    let start=t.taskStartedAt;
    for(let i=0;i<rest.length;i++){
      const c=rest[i];
      if(!c.durationMinutes)break;
      const end=start+c.durationMinutes*60000+(t.extra[c.id]||0);
      const nx=rest[i+1];
      add(end,nx?'Prossimo task':'Tempo finito',nx?'Ora: '+nx.name:c.name);
      start=end;
    }
  }
  return out;
}
let syncT=0,syncBusy=false;
function syncNative(){if(!NP())return;clearTimeout(syncT);syncT=setTimeout(doSync,300)}
async function doSync(){
  const LN=NP();if(!LN)return;
  if(syncBusy){syncNative();return}
  syncBusy=true;
  try{
    const pend=await LN.getPending();
    if(pend&&pend.notifications&&pend.notifications.length)await LN.cancel({notifications:pend.notifications});
    const plan=planNotifs().slice(0,60);
    if(plan.length)await LN.schedule({notifications:plan.map((p,i)=>({id:i+1,title:p.title,body:p.body,channelId:'routine',schedule:{at:new Date(p.at),allowWhileIdle:true}}))});
  }catch(e){}
  syncBusy=false;
}
async function initNative(){
  const LN=NP();if(!LN)return;
  document.documentElement.classList.add('native');
  try{await LN.createChannel({id:'routine',name:'Routine',description:'Promemoria routine',importance:5,visibility:1,vibration:true})}catch(e){}
  try{const p=await LN.checkPermissions();if(p.display!=='granted')await LN.requestPermissions()}catch(e){}
  try{
    const ex=await LN.checkExactNotificationSetting();
    if(ex&&ex.exact_alarm==='denied'&&!localStorage.getItem('exactAsked')){localStorage.setItem('exactAsked','1');await LN.changeExactNotificationSetting()}
  }catch(e){}
  syncNative();
}

/* ---------- wheel picker ---------- */
function makePicker(cols,onChange){
  const wrap=el('<div class="picker"><div class="band"></div><div class="cols"></div></div>');
  const host=wrap.querySelector('.cols');
  const cur=[];
  cols.forEach((c,ci)=>{
    const vals=[];for(let v=0;v<=c.max;v+=c.step)vals.push(v);
    let idx0=vals.indexOf(c.value);
    if(idx0<0)idx0=Math.min(vals.length-1,Math.max(0,Math.round(c.value/c.step)));
    cur[ci]=vals[idx0];
    const col=el('<div class="col" tabindex="0" role="spinbutton"></div>');
    col.setAttribute('aria-label',c.label);
    col.innerHTML=vals.map(v=>`<div class="it"><div class="row"><span class="n">${v}</span><span class="u">${esc(c.label)}</span></div></div>`).join('');
    host.appendChild(col);
    let raf=0,last=idx0,drag=null;
    const paint=()=>{
      raf=0;
      const pos=col.scrollTop/ITEM;
      const items=col.children;
      for(let i=0;i<items.length;i++){
        const d=i-pos,ad=Math.abs(d);
        const rot=Math.max(-65,Math.min(65,-d*24));
        items[i].style.transform=`perspective(340px) rotateX(${rot}deg) scale(${Math.max(.62,1-ad*.1)})`;
        items[i].style.opacity=ad>3.2?0:Math.max(.14,1-ad*.36);
        items[i].classList.toggle('sel',ad<.5);
      }
    };
    col.addEventListener('scroll',()=>{
      if(!raf)raf=requestAnimationFrame(paint);
      const i=Math.max(0,Math.min(vals.length-1,Math.round(col.scrollTop/ITEM)));
      if(i!==last){
        last=i;cur[ci]=vals[i];
        try{if(navigator.vibrate)navigator.vibrate(4)}catch(e){}
        if(onChange)onChange(cur.slice());
      }
    },{passive:true});
    col.addEventListener('keydown',e=>{
      if(e.key==='ArrowUp'){e.preventDefault();col.scrollBy({top:-ITEM,behavior:'smooth'})}
      else if(e.key==='ArrowDown'){e.preventDefault();col.scrollBy({top:ITEM,behavior:'smooth'})}
    });
    col.addEventListener('pointerdown',e=>{
      if(e.pointerType!=='mouse')return;
      drag={y:e.clientY,top:col.scrollTop,moved:false};
      col.style.scrollSnapType='none';
      col.style.cursor='grabbing';
      try{col.setPointerCapture(e.pointerId)}catch(_){}
    });
    col.addEventListener('pointermove',e=>{
      if(!drag)return;
      const dy=e.clientY-drag.y;
      if(Math.abs(dy)>3)drag.moved=true;
      col.scrollTop=drag.top-dy;
    });
    const endDrag=e=>{
      if(!drag)return;
      const d=drag;drag=null;
      col.style.scrollSnapType='';
      col.style.cursor='';
      let idx;
      if(!d.moved){
        const r=col.getBoundingClientRect();
        idx=Math.floor((e.clientY-r.top+col.scrollTop-104)/ITEM);
      }else idx=Math.round(col.scrollTop/ITEM);
      idx=Math.max(0,Math.min(vals.length-1,idx));
      col.scrollTo({top:idx*ITEM,behavior:'smooth'});
    };
    col.addEventListener('pointerup',endDrag);
    col.addEventListener('pointercancel',endDrag);
    requestAnimationFrame(()=>{col.scrollTop=idx0*ITEM;paint()});
  });
  return wrap;
}
const timePicker=(v,cb)=>makePicker([{label:'ore',max:23,step:1,value:v.h},{label:'min',max:59,step:5,value:v.m}],a=>cb({h:a[0],m:a[1]}));
const durPicker=timePicker;
function mountPicker(root,picker){const s=root.querySelector('[data-slot="pk"]');if(s)s.replaceWith(picker)}

/* ---------- views ---------- */
function viewOnboard(){
  if(!S.routines){
    return el(`<div class="page"><div class="hero"><h1 class="title">Benvenuto</h1><p class="lead">Come ti chiami?</p><input class="inp" data-bind="obName" data-enter="start" placeholder="Il tuo nome" autocomplete="given-name" value="${esc(ui.obName)}"></div><div class="bottom"><button class="btn p" data-act="start">Inizia</button></div></div>`);
  }
  return el(`<div class="page"><div class="hero"><h1 class="title">Ciao, ${esc(S.name)}</h1><p class="lead">Ho creato una routine di esempio per ogni giorno della settimana. Vuoi personalizzare ogni giorno adesso?</p></div><div class="bottom"><button class="btn p" data-act="obCustom">Sì, personalizza</button><button class="btn s" data-act="obLater">Più tardi</button></div></div>`);
}
function viewGreeting(){
  return el(`<div class="page"><div class="greet"><h1>${esc(ui.greeting.text)}</h1></div></div>`);
}
function topBar(){
  const d=new Date();
  let ds=d.toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'});
  ds=ds.charAt(0).toUpperCase()+ds.slice(1);
  return `<div class="top"><div><div class="hello">Ciao, ${esc(S.name)}</div><div class="date">${esc(ds)}</div></div><button class="btn t" data-act="openRoutines">Routine</button></div>`;
}
function viewToday(){
  const t=S.today;
  const page=el('<div class="page"></div>');
  page.innerHTML=topBar();
  let body;
  switch(t.phase){
    case 'checkin':body=viewWizard();break;
    case 'prep':body=viewPrep();break;
    case 'backpack':body=viewBackpack();break;
    case 'day':body=viewDay();break;
    case 'checkout':body=viewCheckout();break;
    default:body=viewClosed();
  }
  page.appendChild(body);
  return page;
}
function viewWizard(){
  if(!ui.wiz)ui.wiz={step:0,entry:{h:8,m:0},exit:{h:14,m:0},prep:{h:0,m:10},err:''};
  const w=ui.wiz;
  let b;
  if(w.step===0){
    b=el(`<div class="body"><h1 class="title">Buongiorno</h1><p class="lead">Oggi vai a scuola?</p><div class="bottom"><button class="btn p" data-act="wiz0yes">Sì</button><button class="btn s" data-act="wiz0no">No</button></div></div>`);
    return b;
  }
  const dots=`<div class="dots">${[1,2,3].map(i=>`<i class="${i<=w.step?'on':''}"></i>`).join('')}</div>`;
  const nav=`<div class="bottom"><button class="btn p" data-act="${w.step===3?'wizDone':'wizNext'}">Avanti</button><button class="btn t" data-act="wizBack" style="width:100%">Indietro</button></div>`;
  if(w.step===1){
    b=el(`<div class="body">${dots}<h1 class="title">A che ora entri a scuola?</h1><div data-slot="pk"></div>${nav}</div>`);
    mountPicker(b,timePicker(w.entry,v=>{w.entry=v}));
  }else if(w.step===2){
    b=el(`<div class="body">${dots}<h1 class="title">A che ora esci?</h1><div data-slot="pk"></div><div class="err">${esc(w.err)}</div>${nav}</div>`);
    mountPicker(b,timePicker(w.exit,v=>{w.exit=v}));
  }else{
    b=el(`<div class="body">${dots}<h1 class="title">Quanto tempo ti serve per prepararti?</h1><p class="lead">Poi ti ricordo di fare lo zaino.</p><div data-slot="pk"></div>${nav}</div>`);
    mountPicker(b,durPicker(w.prep,v=>{w.prep=v}));
  }
  return b;
}
function viewPrep(){
  const t=S.today;
  return el(`<div class="body"><div class="card"><div class="eyebrow">Preparazione</div><div class="big" data-cd="${t.prepEndAt}">--:--</div><div class="sub">Preparati. Ti avviso quando è ora di fare lo zaino.</div></div><div class="bottom"><button class="btn s" data-act="prepSkip">Ho già finito</button></div></div>`);
}
function viewBackpack(){
  const rems=remindersFor(S.today.date,'backpack');
  return el(`<div class="body"><div class="card"><div class="eyebrow">Ora</div><h2 class="h2">Prepara lo zaino</h2>${remHtml(rems)}</div><div class="bottom"><button class="btn p" data-act="backpackDone">Fatto</button></div></div>`);
}
function viewDay(){
  const t=S.today,now=Date.now();
  const sub=subOf(),rt=todayRoutine(),cur=curTask();
  const undone=rt.filter(x=>!t.done.includes(x.id));
  const b=el('<div class="body"></div>');
  let card='',list=undone,listTitle='',showDone=false;
  if(sub==='wait'){
    card=`<div class="card"><div class="eyebrow">Si entra alle ${clock(t.schoolStart)}</div><div class="big" data-cd="${tsAt(t.schoolStart)}">--:--</div><div class="sub">all'ingresso a scuola</div></div>`;
    listTitle='Dopo scuola';
  }else if(sub==='school'){
    card=`<div class="card"><div class="eyebrow">A scuola · esci alle ${clock(t.schoolEnd)}</div><div class="big" data-cd="${tsAt(t.schoolEnd)}">--:--</div><div class="sub">all'uscita</div></div>`;
    listTitle='Dopo scuola';
  }else if(cur){
    const end=cur.durationMinutes?taskEnd(cur):0;
    const over=cur.durationMinutes&&now>=end;
    const total=rt.length;
    const idx=rt.indexOf(cur)+1;
    card=`<div class="card"><div class="eyebrow">${over?'Tempo finito':'Ora · '+idx+' di '+total}</div><h2 class="h2">${esc(cur.name)}</h2>${cur.durationMinutes?`<div class="big" data-cd="${end}">--:--</div>`:`<div class="sub" style="margin-top:8px">Senza timer</div>`}${remHtml(taskRems(cur))}${cur.durationMinutes?`<div style="margin-top:10px"><button class="btn t" data-act="extend" style="padding:0">Prolunga</button></div>`:''}</div>`;
    list=undone.filter(x=>x.id!==cur.id);
    listTitle='Dopo';
    showDone=true;
  }
  b.innerHTML=card+(list.length?`<div class="eyebrow sec">${listTitle}</div><div>${list.map(x=>`<div class="urow"><div><div class="un">${esc(x.name)}</div>${remHtml(taskRems(x))}</div><div class="ud">${esc(fmtDur(x.durationMinutes))}</div></div>`).join('')}</div>`:'');
  if(showDone)b.insertAdjacentHTML('beforeend','<div class="bottom"><button class="btn p" data-act="done">Fatto</button></div>');
  return b;
}
function viewCheckout(){
  if(!ui.co)ui.co={step:0,target:'backpack',text:'',added:[]};
  const co=ui.co;
  if(co.step===0){
    return el(`<div class="body"><h1 class="title">Giornata finita</h1><p class="lead">Vuoi mettere un reminder per domani?</p><div class="bottom"><button class="btn p" data-act="coYes">Sì</button><button class="btn s" data-act="coNo">No, chiudi la giornata</button></div></div>`);
  }
  const tk=dayKeyOf(nextDateObj());
  const tasks=S.routines[tk]||[];
  const targets=[{id:'backpack',name:'Prepara lo zaino'},...tasks.map(x=>({id:x.id,name:x.name}))];
  const nameOf=id=>{const f=targets.find(x=>x.id===id);return f?f.name:'Prepara lo zaino'};
  return el(`<div class="body"><h1 class="title">Reminder per domani</h1><p class="lead">A quale task di ${esc(dayName(tk))} lo colleghi?</p><div class="opts">${targets.map(o=>`<button class="opt${o.id===co.target?' on':''}" data-act="coTarget" data-id="${esc(o.id)}">${esc(o.name)}</button>`).join('')}</div><input class="inp" data-bind="co.text" data-enter="coAdd" placeholder="Es. Non scordare il disegno di tecnologia" value="${esc(co.text)}">${co.added.length?`<div class="added"><div class="eyebrow">Aggiunti</div>${co.added.map(a=>`<div class="urow"><div><div class="un">${esc(nameOf(a.target))}</div>${remHtml([a.text])}</div></div>`).join('')}</div>`:''}<div class="bottom"><button class="btn p" data-act="coAdd">Aggiungi reminder</button><button class="btn s" data-act="coFinish">${co.added.length?'Ho finito':'Chiudi la giornata'}</button></div></div>`);
}
function viewClosed(){
  return el(`<div class="body"><div class="hero" style="text-align:center"><h1 class="title">Buonanotte, ${esc(S.name)}</h1><p class="lead">Giornata chiusa. Domani nuovo check-in.</p></div></div>`);
}
function viewRoutines(){
  const list=S.routines[ui.edDay]||[];
  const tk=dayKeyOf(new Date());
  const n=el(`<div class="page"><div class="top"><div class="hello">Routine</div><button class="btn t" data-act="closeRoutines">Chiudi</button></div>
<div class="tabs">${DAYS.map(d=>`<button class="tab${d[0]===ui.edDay?' on':''}${d[0]===tk?' today':''}" data-act="edDay" data-day="${d[0]}">${d[2]}</button>`).join('')}</div>
<div class="edtitle">${esc(dayName(ui.edDay))}</div>
<div>${list.length?list.map((t,i)=>`<div class="trow"><div class="mv"><button class="ic" data-act="taskUp" data-id="${esc(t.id)}" ${i===0?'disabled':''} aria-label="Su">↑</button><button class="ic" data-act="taskDown" data-id="${esc(t.id)}" ${i===list.length-1?'disabled':''} aria-label="Giù">↓</button></div><div class="tinfo" data-act="taskEdit" data-id="${esc(t.id)}"><div class="tn">${esc(t.name)}</div><div class="tm">${esc(fmtDur(t.durationMinutes))}</div>${t.reminder?`<div class="rem">${BELL}<span>${esc(t.reminder)}</span></div>`:''}</div><button class="btn t" data-act="taskEdit" data-id="${esc(t.id)}">Modifica</button></div>`).join(''):'<div class="empty">Nessun task. Giornata libera.</div>'}</div>
<div class="bottom"><button class="btn p" data-act="taskAdd">Aggiungi task</button><div class="two"><button class="btn s" data-act="copyOpen">Copia da…</button><button class="btn s" data-act="applyOpen">Applica a…</button></div><button class="btn t" data-act="rename" style="width:100%">Cambia nome</button></div></div>`);
  return n;
}
function viewSheet(){
  const s=ui.sheet;
  const wrap=el('<div class="sheetwrap"><div class="sback" data-act="sheetClose"></div><div class="sheet"></div></div>');
  const sh=wrap.querySelector('.sheet');
  if(s.type==='extend'){
    sh.innerHTML=`<h3>Prolunga</h3><p class="lead">Quanto tempo aggiungere?</p><div data-slot="pk"></div><div class="stack"><button class="btn p" data-act="extendOk">Aggiungi</button><button class="btn s" data-act="sheetClose">Annulla</button></div>`;
    mountPicker(sh,durPicker({h:s.h,m:s.m},v=>{s.h=v.h;s.m=v.m}));
  }else if(s.type==='task'){
    sh.innerHTML=`<h3>${s.id?'Modifica task':'Nuovo task'}</h3><div class="lbl">Nome</div><input class="inp" data-bind="sheet.name" placeholder="Es. Allenamento" value="${esc(s.name)}"><div class="lbl">Durata</div><div data-slot="pk"></div><div class="lbl">Reminder (opzionale)</div><input class="inp" data-bind="sheet.rem" placeholder="Es. Porta la borraccia" value="${esc(s.rem)}"><div class="stack"><button class="btn p" data-act="taskSave">Salva</button>${s.id?'<button class="btn bad" data-act="taskDel">Elimina</button>':''}<button class="btn s" data-act="sheetClose">Annulla</button></div>`;
    mountPicker(sh,durPicker({h:s.h,m:s.m},v=>{s.h=v.h;s.m=v.m}));
  }else if(s.type==='copy'){
    sh.innerHTML=`<h3>Copia da…</h3><p class="lead">Sostituisce la routine di ${esc(dayName(ui.edDay))} con quella del giorno scelto.</p><div class="stack">${DAYS.filter(d=>d[0]!==ui.edDay).map(d=>`<button class="btn s" data-act="copyFrom" data-day="${d[0]}">${d[1]}</button>`).join('')}<button class="btn t" data-act="sheetClose" style="width:100%">Annulla</button></div>`;
  }else if(s.type==='apply'){
    sh.innerHTML=`<h3>Applica a…</h3><p class="lead">Copia la routine di ${esc(dayName(ui.edDay))} sui giorni scelti.</p><div>${DAYS.filter(d=>d[0]!==ui.edDay).map(d=>`<button class="chk${s.days.includes(d[0])?' on':''}" data-act="applyTog" data-day="${d[0]}"><b></b>${d[1]}</button>`).join('')}</div><div class="stack"><button class="btn p" data-act="applyOk" ${s.days.length?'':'disabled'}>Applica</button><button class="btn s" data-act="sheetClose">Annulla</button></div>`;
  }
  return wrap;
}

/* ---------- render ---------- */
function render(){
  const app=$('#app');
  app.innerHTML='';
  let node;
  if(!S.routines||!S.onboarded)node=viewOnboard();
  else if(ui.greeting)node=viewGreeting();
  else if(ui.screen==='routines')node=viewRoutines();
  else node=viewToday();
  app.appendChild(node);
  if(ui.sheet&&S.routines)app.appendChild(viewSheet());
  updateCountdowns();
}
function updateCountdowns(){
  const now=Date.now();
  $$('[data-cd]').forEach(e=>{e.textContent=fmtCd(+e.dataset.cd-now)});
}

/* ---------- actions ---------- */
function syncInputs(){
  $$('[data-bind]').forEach(i=>{
    const p=i.dataset.bind.split('.');
    let o=ui;
    for(let k=0;k<p.length-1;k++){if(!o[p[k]])return;o=o[p[k]]}
    o[p[p.length-1]]=i.value;
  });
}
function closeDay(){S.today.phase='closed';ui.co=null;save();render()}
function act(name,btn){
  syncInputs();
  const t=S.today;
  const id=btn&&btn.dataset?btn.dataset.id:null;
  switch(name){
    case 'start':{
      const n=(ui.obName||'').trim();
      if(!n){showToast('Scrivi il tuo nome','');return}
      S.name=n;S.routines=defaultRoutines();save();askPerm();render();break;
    }
    case 'obCustom':S.onboarded=true;ui.screen='routines';ui.edDay=dayKeyOf(new Date());save();render();break;
    case 'obLater':S.onboarded=true;ui.screen='main';save();render();break;

    case 'wiz0yes':ui.wiz.step=1;render();break;
    case 'wiz0no':t.schoolGo=false;t.phase='day';t.taskStartedAt=Date.now();ui.wiz=null;ui.lastKey=null;save();render();break;
    case 'wizBack':ui.wiz.step=Math.max(0,ui.wiz.step-1);ui.wiz.err='';render();break;
    case 'wizNext':{
      const w=ui.wiz;
      if(w.step===2){
        if(w.exit.h*60+w.exit.m<=w.entry.h*60+w.entry.m){w.err="L'uscita deve essere dopo l'entrata.";render();return}
      }
      w.err='';w.step++;render();break;
    }
    case 'wizDone':{
      const w=ui.wiz;
      t.schoolGo=true;
      t.schoolStart=w.entry.h*60+w.entry.m;
      t.schoolEnd=w.exit.h*60+w.exit.m;
      t.prepMin=w.prep.h*60+w.prep.m;
      if(t.prepMin>0){t.phase='prep';t.prepEndAt=Date.now()+t.prepMin*60000}
      else t.phase='backpack';
      ui.wiz=null;save();render();break;
    }
    case 'prepSkip':t.phase='backpack';save();render();break;
    case 'backpackDone':
      consume('backpack');
      t.phase='day';
      t.taskStartedAt=t.schoolGo?tsAt(t.schoolEnd):Date.now();
      ui.lastKey=null;
      ui.greeting={text:t.schoolGo?'Buona scuola, '+S.name+'!':'Buona giornata, '+S.name+'!',until:Date.now()+2600};
      save();render();break;

    case 'done':{
      const cur=curTask();if(!cur)break;
      t.done.push(cur.id);consume(cur.id);
      t.taskStartedAt=Date.now();
      if(!curTask()){t.phase='checkout';ui.co=null}
      ui.lastKey=null;save();render();break;
    }
    case 'extend':ui.sheet={type:'extend',h:0,m:15};render();break;
    case 'extendOk':{
      const cur=curTask();
      const add=(ui.sheet.h*60+ui.sheet.m)*60000;
      if(cur&&add>0)t.extra[cur.id]=(t.extra[cur.id]||0)+add;
      ui.sheet=null;ui.lastKey=null;save();render();break;
    }
    case 'sheetClose':ui.sheet=null;render();break;

    case 'coYes':ui.co.step=1;render();break;
    case 'coNo':closeDay();break;
    case 'coTarget':ui.co.target=id;render();break;
    case 'coAdd':{
      const txt=(ui.co.text||'').trim();
      if(!txt){showToast('Scrivi il reminder','');return}
      S.dayReminders.push({date:dateStr(nextDateObj()),target:ui.co.target,text:txt});
      ui.co.added.push({target:ui.co.target,text:txt});
      ui.co.text='';save();render();break;
    }
    case 'coFinish':closeDay();break;

    case 'openRoutines':ui.screen='routines';ui.edDay=dayKeyOf(new Date());render();break;
    case 'closeRoutines':ui.screen='main';ui.sheet=null;render();break;
    case 'edDay':ui.edDay=btn.dataset.day;render();break;
    case 'taskUp':case 'taskDown':{
      const L=S.routines[ui.edDay];const i=L.findIndex(x=>x.id===id);
      const j=name==='taskUp'?i-1:i+1;
      if(i>=0&&j>=0&&j<L.length){[L[i],L[j]]=[L[j],L[i]]}
      save();render();break;
    }
    case 'taskEdit':{
      const x=S.routines[ui.edDay].find(q=>q.id===id);if(!x)break;
      ui.sheet={type:'task',id:x.id,name:x.name,rem:x.reminder||'',h:Math.floor(x.durationMinutes/60),m:x.durationMinutes%60};
      render();break;
    }
    case 'taskAdd':ui.sheet={type:'task',id:null,name:'',rem:'',h:0,m:30};render();break;
    case 'taskSave':{
      const s=ui.sheet;
      const nm=(s.name||'').trim();
      if(!nm){showToast('Scrivi il nome del task','');return}
      const dur=s.h*60+s.m;
      const L=S.routines[ui.edDay];
      if(s.id){const x=L.find(q=>q.id===s.id);if(x){x.name=nm;x.durationMinutes=dur;x.reminder=(s.rem||'').trim()}}
      else L.push({id:uid(),name:nm,durationMinutes:dur,reminder:(s.rem||'').trim()});
      ui.sheet=null;ui.lastKey=null;save();render();break;
    }
    case 'taskDel':{
      const s=ui.sheet;
      if(!confirm('Eliminare questo task?'))return;
      S.routines[ui.edDay]=S.routines[ui.edDay].filter(q=>q.id!==s.id);
      S.dayReminders.forEach(r=>{if(r.target===s.id)r.target='backpack'});
      t.done=t.done.filter(q=>q!==s.id);
      ui.sheet=null;ui.lastKey=null;save();render();break;
    }
    case 'copyOpen':ui.sheet={type:'copy'};render();break;
    case 'copyFrom':{
      const from=btn.dataset.day;
      if(!confirm('Sostituire la routine di '+dayName(ui.edDay)+' con quella di '+dayName(from)+'?'))return;
      S.routines[ui.edDay]=cloneTasks(S.routines[from]||[]);
      ui.sheet=null;ui.lastKey=null;save();render();break;
    }
    case 'applyOpen':ui.sheet={type:'apply',days:[]};render();break;
    case 'applyTog':{
      const d=btn.dataset.day,a=ui.sheet.days,i=a.indexOf(d);
      if(i<0)a.push(d);else a.splice(i,1);
      render();break;
    }
    case 'applyOk':{
      const ds=ui.sheet.days;
      if(!ds.length)return;
      if(!confirm('Sostituire la routine di: '+ds.map(dayName).join(', ')+'?'))return;
      ds.forEach(d=>{S.routines[d]=cloneTasks(S.routines[ui.edDay]||[])});
      ui.sheet=null;ui.lastKey=null;save();render();break;
    }
    case 'rename':{
      const n=prompt('Il tuo nome',S.name);
      if(n&&n.trim()){S.name=n.trim();save();render()}
      break;
    }
  }
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');
  if(!b)return;
  if(b.disabled)return;
  act(b.dataset.act,b);
});
document.addEventListener('input',e=>{if(e.target.matches&&e.target.matches('[data-bind]'))syncInputs()});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.enter){e.preventDefault();act(e.target.dataset.enter,e.target)}
});

/* ---------- tick ---------- */
function tick(){
  if(!S.routines||!S.onboarded)return;
  if(rollDay()){render();return}
  const t=S.today,now=Date.now();
  let re=false;
  if(ui.greeting&&now>=ui.greeting.until){ui.greeting=null;re=true}
  if(t.phase==='prep'&&now>=t.prepEndAt){
    t.phase='backpack';save();
    notify('prep','Zaino','È ora di preparare lo zaino',t.prepEndAt);
    re=true;
  }
  if(t.phase==='day'){
    const sub=subOf();
    if(t.schoolGo){
      if(now>=tsAt(t.schoolStart))notify('start','Scuola','Timer scuola partito',tsAt(t.schoolStart));
      if(now>=tsAt(t.schoolEnd))notify('end','Scuola finita','Parte la routine',tsAt(t.schoolEnd));
    }
    if(sub==='routine'){
      let adv=null,guard=0;
      while(guard++<60){
        const c=curTask();
        if(!c||!c.durationMinutes)break;
        const end=taskEnd(c);
        if(now<end)break;
        const rest=todayRoutine().filter(x=>!t.done.includes(x.id)&&x.id!==c.id);
        if(!rest.length)break;
        t.done.push(c.id);consume(c.id);t.taskStartedAt=end;adv=rest[0];
      }
      if(adv){save();notify('adv:'+t.done.length,'Prossimo task','Ora: '+adv.name,t.taskStartedAt)}
      const c2=curTask();
      if(!c2){t.phase='checkout';ui.co=null;save();re=true}
      else if(c2.durationMinutes&&now>=taskEnd(c2)){
        notify('over:'+c2.id+':'+(t.extra[c2.id]||0),'Tempo finito',c2.name,taskEnd(c2));
      }
    }
    if(t.phase==='day'){
      const c=sub==='routine'?curTask():null;
      const over=c&&c.durationMinutes&&now>=taskEnd(c);
      const key=sub+':'+(c?c.id:'')+':'+(over?'o':'');
      if(key!==ui.lastKey){ui.lastKey=key;re=true}
    }
  }
  if(re)render();else updateCountdowns();
}

/* ---------- init ---------- */
if('serviceWorker' in navigator&&location.protocol!=='file:'&&!NP()){navigator.serviceWorker.register('sw.js').catch(()=>{})}
if(NP()){document.documentElement.classList.add('native');if(S.routines)initNative()}
rollDay();
render();
setInterval(tick,1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});
})();
</script>
</body>
